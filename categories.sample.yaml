# Authoritative list of spending categories. (TEMPLATE — copy this to
# categories.yaml, which is gitignored, and fill in your own instructions.)
#
# Each entry has:
#   name:         the exact category string. This is the canonical value the
#                 agent must return AND the value matched against the archive
#                 sheet's "Category" column, so renaming here orphans existing
#                 archive rows (they get dropped from the similarity pool).
#   instructions: OPTIONAL per-category guidance for the agent on how to handle
#                 this category. Leave as "" for none. Multi-line is fine via `|`.
#                 Put merchant- and rule-specific guidance under the category it
#                 resolves to (e.g. "Payments to The Fynn for ~$4200 belong
#                 here" under Rent). The examples below are illustrative.
#
# Order is preserved when the list is shown to the agent.

